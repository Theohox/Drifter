# Drifter configuration for this project.
# See https://github.com/hox/drifter for documentation.

[drifter]
root = "."
max_pending_age_days = 7
drift_threshold = 70

# Built-in checks
[[drifter.checks]]
name = "stale_reference"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "hardcoded_path"
enabled = true
severity = "error"

[[drifter.checks]]
name = "digest_staleness"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "conductor_health"
enabled = true
severity = "error"

[[drifter.checks]]
name = "cross_doc_consistency"
enabled = true
severity = "warn"

# Paths to ignore during scanning
[drifter.ignore]
paths = [
    "venv/",
    ".venv/",
    "node_modules/",
    "__pycache__/",
    ".git/",
    ".tox/",
    ".pytest_cache/",
    "target/",
    "dist/",
    "build/",
    "templates/",
]
