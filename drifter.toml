# Drifter configuration for this project.
# See https://github.com/hox/drifter for documentation.

[drifter]
root = "."
max_pending_age_days = 7
drift_threshold = 70
# history_path = ".bash_history"  # Optional: enables AgentSelfAuditCheck + GitCommitApprovalCheck

# Built-in checks
[[drifter.checks]]
name = "stale_reference"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "hardcoded_path"
enabled = true
severity = "error"

[[drifter.checks]]
name = "digest_staleness"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "conductor_health"
enabled = true
severity = "error"

[[drifter.checks]]
name = "cross_doc_consistency"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "git_safety"
enabled = true
severity = "error"

[[drifter.checks]]
name = "dangerous_patterns"
enabled = true
severity = "error"

[[drifter.checks]]
name = "timestamp_staleness"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "conductor_content"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "architecture_doc_sync"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "readme_completeness"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "doc_coverage"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "pre_flight_sync"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "credential_leak"
enabled = true
severity = "error"

[[drifter.checks]]
name = "dead_code"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "test_coverage"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "cli_output"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "gitignore"
enabled = true
severity = "error"

[[drifter.checks]]
name = "pipeline_integrity"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "archive_integrity"
enabled = true
severity = "error"

[[drifter.checks]]
name = "tomllib_compatibility"
enabled = true
severity = "error"

[[drifter.checks]]
name = "audit_coverage"
enabled = true
severity = "error"

[[drifter.checks]]
name = "reporter_completeness"
enabled = true
severity = "error"

[[drifter.checks]]
name = "agent_self_audit"
enabled = true
severity = "error"

[[drifter.checks]]
name = "git_commit_approval"
enabled = true
severity = "error"

[[drifter.checks]]
name = "tree_integrity"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "file_size"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "manifest_sync"
enabled = true
severity = "error"

[[drifter.checks]]
name = "claim_sync"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "read_before_write"
enabled = true
severity = "error"

[[drifter.checks]]
name = "test_after_write"
enabled = true
severity = "error"

[[drifter.checks]]
name = "drift_check_after_write"
enabled = true
severity = "error"

[[drifter.checks]]
name = "no_rush"
enabled = true
severity = "warn"

[[drifter.checks]]
name = "config_sync"
enabled = true
severity = "error"

# Paths to ignore during scanning
[drifter.ignore]
paths = [
    "venv/",
    ".venv/",
    "node_modules/",
    "__pycache__/",
    ".git/",
    ".tox/",
    ".pytest_cache/",
    "target/",
    "dist/",
    "build/",
    "templates/",
]
