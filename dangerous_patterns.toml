# dangerous_patterns.toml — Agent Command Restrictions
# Canonical location: repo root. Read this before running ANY shell command.
#
# This file is the single source of truth for what agents must never do.
# It is agent-agnostic: any AI agent (Kimi, Claude, Codex, Copilot, custom)
# can read it and know the boundaries.
#
# If the computer resets, clone the repo and read this file.
# You will immediately know what commands are forbidden.

[git]
# NEVER run these. Not with flags. Not with excuses.
# The human reviews changes in the Git Panel and decides when to commit/push.
always_block = [
    "git commit",
    "git push",
    "git reset",
    "git rebase",
    "git merge",
    "git checkout -b",
    "git tag",
    "git cherry-pick",
]

# Allowed without restriction — informational only
allowed = [
    "git status",
    "git diff",
    "git log",
    "git show",
    "git branch",
]

# Allowed ONLY if human explicitly asked
# Never assume staging is desired
approval_required = [
    "git add",
]

[shell]
# Unconditionally blocked patterns — these destroy systems or exfiltrate data
blocked = [
    "rm -rf /",
    "rm -rf ~",
    "dd if=",
    "mkfs",
    "> /dev/sd",
    "curl | sh",
    "curl | bash",
    "wget | sh",
    "wget | bash",
    "sudo rm",
    "chmod 777 /",
]

# Patterns that require explicit human confirmation before execution
confirm_required = [
    "rm -rf",
    "rm -r",
    "sudo",
    "docker",
    "kubectl",
]

[filesystem]
# System directories — never touch without explicit confirmation
system_dirs = [
    "/etc",
    "/usr",
    "/bin",
    "/sbin",
    "/var",
    "/root",
]

# Sensitive file patterns — never read or write without approval
sensitive_patterns = [
    "*.key",
    "*.pem",
    "*.crt",
    ".env",
    "id_rsa*",
    "*.password",
    "*secret*",
]
