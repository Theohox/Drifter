name: Publish

# PyPI publish is MANUAL until trusted publishing is configured on PyPI
# (pending publisher: project drifter-check, owner Theohox, repo Drifter,
# workflow publish.yml, environment pypi). To re-enable automatic publishes,
# restore the tag trigger:  on: push: tags: ["v*"]
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # PyPI trusted publishing (OIDC): configure a pending publisher for
    # repo Theohox/Drifter, workflow publish.yml, environment pypi.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
