[checks]
count = 35
names = [
    "stale_reference",
    "hardcoded_path",
    "digest_staleness",
    "conductor_health",
    "cross_doc_consistency",
    "git_safety",
    "dangerous_patterns",
    "timestamp_staleness",
    "conductor_content",
    "architecture_doc_sync",
    "readme_completeness",
    "doc_coverage",
    "pre_flight_sync",
    "credential_leak",
    "dead_code",
    "test_coverage",
    "cli_output",
    "gitignore",
    "pipeline_integrity",
    "archive_integrity",
    "tomllib_compatibility",
    "audit_coverage",
    "reporter_completeness",
    "agent_self_audit",
    "git_commit_approval",
    "tree_integrity",
    "file_size",
    "manifest_sync",
    "claim_sync",
    "read_before_write",
    "test_after_write",
    "drift_check_after_write",
    "no_rush",
    "config_sync",
    "ghost_reference",
]

[claims]
# Numerical claims in docs that must match manifest
"README.md" = [
    { pattern = "{count} automated drift checks", value = "checks.count" },
    { pattern = "{count} automated checks", value = "checks.count" },
]
"docs/architecture.md" = [
    { pattern = "Built-in Checks ({count})", value = "checks.count" },
]
