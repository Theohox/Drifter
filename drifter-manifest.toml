# Drifter Canonical Manifest
# Single source of truth for codebase structure, counts, and doc claims.
# Agents: read this before modifying code. Checks validate against this.

[project]
name = "Drifter"
version = "0.4.0"
python_requires = ">=3.10"

[structure]
max_file_lines = 300

# Complete source tree — every file must be declared
# [tree.<path>] where <path> is the directory prefix (use "root" for repo root)
# Budget policy: max_lines = current size + ~15% headroom, rounded to a clean
# number. Re-baseline with wc -l whenever a file legitimately grows past budget.

[tree.root]
"AGENTS.md" = { type = "constitution", max_lines = 370 }
"LICENSE-MIT" = { type = "license" }
"LICENSE-APACHE" = { type = "license" }
"README.md" = { type = "readme" }
"CHANGELOG.md" = { type = "changelog" }
"dangerous_patterns.toml" = { type = "config" }

"drifter-manifest.toml" = { type = "manifest" }
"drifter.toml" = { type = "config" }
".drifter/session.log" = { type = "log", note = "Per-project session audit log, .gitignored" }
".drifter/.session_secret" = { type = "secret", note = "HMAC secret for session log integrity, .gitignored" }
".drifter/capability-manifest.json" = { type = "generated", max_lines = 385, note = "Auto-generated capability manifest, .gitignored" }
".gitignore" = { type = "config", note = "Git ignore rules" }
".github/workflows/ci.yml" = { type = "config", note = "GitHub Actions CI workflow" }
".github/workflows/publish.yml" = { type = "config", note = "Tag-triggered PyPI publish via trusted publishing" }
"pyproject.toml" = { type = "config" }

[tree.src.drifter]
"__init__.py" = { layer = "package", max_lines = 10, purpose = "Package init" }
"cli.py" = { layer = "cli", max_lines = 220, purpose = "Parser + dispatch", imports = ["_cli_admin", "_cli_check", "_cli_conductor", "_cli_init", "_hook_commands"] }
"_cli_admin.py" = { layer = "cli", max_lines = 145, purpose = "CLI handlers: preflight, audit, log, manifest, describe" }
"_cli_check.py" = { layer = "cli", max_lines = 110, purpose = "CLI handlers: check, session-report" }
"_cli_common.py" = { layer = "cli", max_lines = 20, purpose = "Shared CLI presentation helpers (banner/rule)" }
"_cli_conductor.py" = { layer = "cli", max_lines = 75, purpose = "CLI handlers: conductor" }
"_cli_init.py" = { layer = "cli", max_lines = 185, purpose = "CLI handlers: init, validate" }
"config.py" = { layer = "core", max_lines = 315, purpose = "Config loader" }
"conductor.py" = { layer = "core", max_lines = 255, purpose = "Conductor manager" }
"_conductor_helpers.py" = { layer = "core", max_lines = 165, purpose = "Conductor helpers" }
"doc_validator.py" = { layer = "core", max_lines = 55, purpose = "Doc validator" }
"_doc_validate.py" = { layer = "core", max_lines = 205, purpose = "Doc validation internals" }
"drift_guard.py" = { layer = "engine", max_lines = 230, purpose = "Check runner + custom check loader" }
"pre_flight.py" = { layer = "core", max_lines = 305, purpose = "Pre-flight runner" }
"shell_guard.py" = { layer = "core", max_lines = 400, purpose = "Command classifier" }
"errors.py" = { layer = "core", max_lines = 50, purpose = "Enforcement exceptions" }
"_types.py" = { layer = "core", max_lines = 25, purpose = "Shared enforcement types (Classification)" }
"_templates.py" = { layer = "core", max_lines = 30, purpose = "Bundled template resolution (importlib.resources)" }
"plugin_api.py" = { layer = "core", max_lines = 50, purpose = "Plugin interceptor API" }
"session_logger.py" = { layer = "core", max_lines = 150, purpose = "Session audit logger" }
"history_reader.py" = { layer = "core", max_lines = 160, purpose = "Cross-platform shell history reader" }
"_hook_commands.py" = { layer = "core", max_lines = 95, purpose = "Git hook install/uninstall helpers" }
"_toml_utils.py" = { layer = "core", max_lines = 30, purpose = "Safe TOML loading" }
"__main__.py" = { layer = "cli", max_lines = 10, purpose = "Module entry point for python -m drifter" }
"manifest_generator.py" = { layer = "core", max_lines = 470, purpose = "Capability manifest generator" }

[tree.src.drifter.checks]
"__init__.py" = { layer = "checks", max_lines = 105, purpose = "Check registry" }
"_base.py" = { layer = "checks", max_lines = 30, purpose = "Protocol and dataclasses" }
"agent_behavior.py" = { layer = "checks", max_lines = 215, purpose = "Agent behavior checks" }
"code_quality.py" = { layer = "checks", max_lines = 250, purpose = "Code quality checks" }
"docs.py" = { layer = "checks", max_lines = 335, purpose = "Documentation checks" }
"project.py" = { layer = "checks", max_lines = 415, purpose = "Project state checks" }
"security.py" = { layer = "checks", max_lines = 325, purpose = "Security checks" }
"structure.py" = { layer = "checks", max_lines = 445, purpose = "Manifest structural checks" }
"sync.py" = { layer = "checks", max_lines = 585, purpose = "Sync verification checks" }
"config_sync.py" = { layer = "checks", max_lines = 160, purpose = "Config sync check" }
"behavioral.py" = { layer = "checks", max_lines = 295, purpose = "Behavioral audit checks" }
"ghost_reference.py" = { layer = "checks", max_lines = 190, purpose = "Ghost reference detection" }
"_shared.py" = { layer = "checks", max_lines = 115, purpose = "Shared check helpers (manifest loader, skip patterns, path resolution)" }

[tree.src.drifter.reporters]
"__init__.py" = { layer = "reporters", max_lines = 10, purpose = "Reporter package" }
"console.py" = { layer = "reporters", max_lines = 45, purpose = "Console reporter" }
"github_actions.py" = { layer = "reporters", max_lines = 20, purpose = "GitHub Actions reporter" }
"json_reporter.py" = { layer = "reporters", max_lines = 30, purpose = "JSON reporter" }

[tree.docs]
"adoption-guide.md" = { type = "guide", max_lines = 380 }
"architecture.md" = { type = "snapshot" }
"document-types.md" = { type = "reference" }
"methodology.md" = { type = "constitution" }
"phase-index.md" = { type = "index" }
"project-conductor.md" = { type = "backlog", max_lines = 350 }
"rules-reference.md" = { type = "reference", max_lines = 370 }
"session-protocol.md" = { type = "playbook" }
"wiki.md" = { type = "reference", max_lines = 705 }
"Drifter_SOWchanges.md" = { type = "reference", max_lines = 300 }
"sow-v3-critique.md" = { type = "reference", max_lines = 565 }
"digests/index.md" = { type = "snapshot" }
"digests/session-2026-05-27-manifest-and-audit-log.md" = { type = "archive" }
"digests/session-2026-05-29-eliminate-false-drift.md" = { type = "archive" }
"digests/session-2026-06-01-integration-hardening.md" = { type = "archive" }
"digests/session-2026-06-04-v0-3-0-security-hardening.md" = { type = "archive" }
"digests/session-2026-10-06-v0-4-0-batch-1-config-and-severity.md" = { type = "archive" }
"digests/session-2026-10-06-v0-4-0-batch-2-reporters-and-cli.md" = { type = "archive" }
"digests/session-2026-10-07-production-grade-cleanup.md" = { type = "archive" }

[tree.docs.archive]
