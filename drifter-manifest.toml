"FEAT-001-foundation.md" = { type = "archive" }
"CHECK-001-archive-pipeline.md" = { type = "archive" }
"CHECK-002-semantic-id-migration-phase-metadata-and-dependenc.md" = { type = "archive" }
"RELEASE-001-final-gates-session-log-rotation-true-drift-score-.md" = { type = "archive" }

