[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "drifter-check"
version = "0.4.0"
description = "Universal drift guard for AI agents — enforce discipline, prevent bloat, and stop hallucination before it starts."
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "hox" },
]
keywords = ["ai", "agent", "llm", "drift", "guard", "code-quality", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "tomli >= 1.2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]
mcp = [
    "fastmcp",
]

[project.scripts]
drifter = "drifter.cli:main"

[project.urls]
Homepage = "https://github.com/Theohox/Drifter"
Documentation = "https://github.com/Theohox/Drifter/tree/main/docs"
Issues = "https://github.com/Theohox/Drifter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/drifter"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true
