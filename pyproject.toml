[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "drifter-check"
version = "0.4.0"
description = "Universal drift guard for AI agents — enforce discipline, prevent bloat, and stop hallucination before it starts."
readme = "README.md"
license = "MIT OR Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "hox" },
]
keywords = ["ai", "agent", "llm", "drift", "guard", "code-quality", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "tomli >= 1.2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    # Pinned band: bump deliberately. CI installs the latest ruff otherwise,
    # and new ruff releases introduce new lint rules that break the build.
    "ruff >= 0.16, < 0.17",
    "mypy",
]
mcp = [
    "fastmcp",
]

[project.scripts]
drifter = "drifter.cli:main"

[project.urls]
Homepage = "https://github.com/Theohox/Drifter"
Documentation = "https://github.com/Theohox/Drifter/tree/main/docs"
Issues = "https://github.com/Theohox/Drifter/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/drifter"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Explicit rule set. Ruff 0.16 expanded its default from 59 to 413 rules,
# which broke CI when GitHub Actions installed the latest release. This list
# pins the rule families we adopt; expanding it is a deliberate act, not
# upstream default drift.
select = ["E", "F", "I", "UP", "B", "SIM", "S", "BLE", "RUF", "PLW", "FURB", "PLR"]
ignore = [
    # Drift checks are deliberately defensive/best-effort: one bad file,
    # unreadable path, or failing check must never crash the whole run.
    # drift_guard additionally wraps every check.run in a blind except.
    "BLE001",
    "S110",
    "S112",
    # Same defensive pattern: plain try/except/pass is kept over
    # contextlib.suppress for consistency with the S110 policy above.
    "SIM105",
    # The formatter owns line length; E501 would fight `ruff format`.
    "E501",
    # Subprocess targets are fixed, vetted binaries (git, sys.executable).
    "S603",
    "S607",
    # Reusing the loop variable for the parsed value is an accepted idiom here.
    "PLW2901",
    # Pylint complexity/count thresholds are advisory, not hard limits.
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR2004",
    # Console reporter uses the ℹ glyph deliberately.
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
# Asserts are idiomatic in pytest.
"tests/**" = ["S101"]
# sys.path bootstrap before imports; fake tokens for auth tests.
"tests/test_mcp_server.py" = ["E402", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true
