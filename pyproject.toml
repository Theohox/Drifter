[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drifter"
version = "0.2.0"
description = "Universal drift guard for AI agents — enforce discipline, prevent bloat, and stop hallucination before it starts."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "hox" },
]
keywords = ["ai", "agent", "llm", "drift", "guard", "code-quality", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "tomli >= 1.2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
memory = [
    "sqlite-fts4",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
drifter = "drifter.cli:main"

[project.urls]
Homepage = "https://github.com/hox/drifter"
Documentation = "https://github.com/hox/drifter/tree/main/docs"
Issues = "https://github.com/hox/drifter/issues"

[tool.drifter]
root = "."
max_pending_age_days = 7
drift_threshold = 70

[[tool.drifter.checks]]
name = "stale_reference"
enabled = true
severity = "warn"

[[tool.drifter.checks]]
name = "hardcoded_path"
enabled = true
severity = "error"

[[tool.drifter.checks]]
name = "digest_staleness"
enabled = true
severity = "warn"

[[tool.drifter.checks]]
name = "conductor_health"
enabled = true
severity = "error"

[[tool.drifter.checks]]
name = "cross_doc_consistency"
enabled = true
severity = "warn"

[[tool.drifter.checks]]
name = "git_safety"
enabled = true
severity = "error"

[[tool.drifter.checks]]
name = "dangerous_patterns"
enabled = true
severity = "error"

[[tool.drifter.checks]]
name = "timestamp_staleness"
enabled = true
severity = "warn"

[[tool.drifter.checks]]
name = "conductor_content"
enabled = true
severity = "warn"

[[tool.drifter.checks]]
name = "architecture_doc_sync"
enabled = true
severity = "warn"

[[tool.drifter.checks]]
name = "readme_completeness"
enabled = true
severity = "warn"

[[tool.drifter.checks]]
name = "pre_flight_sync"
enabled = true
severity = "warn"

[[tool.drifter.checks]]
name = "credential_leak"
enabled = true
severity = "error"

[[tool.drifter.checks]]
name = "dead_code"
enabled = true
severity = "warn"

[[tool.drifter.checks]]
name = "test_coverage"
enabled = true
severity = "warn"

[[tool.drifter.checks]]
name = "cli_output"
enabled = true
severity = "warn"

[[tool.drifter.checks]]
name = "gitignore"
enabled = true
severity = "error"

[[tool.drifter.checks]]
name = "pipeline_integrity"
enabled = true
severity = "warn"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]
ignore = ["D100", "D104", "D107"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
