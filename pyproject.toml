[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drifter"
version = "0.2.0"
description = "Universal drift guard for AI agents — enforce discipline, prevent bloat, and stop hallucination before it starts."
readme = "README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "hox" },
]
keywords = ["ai", "agent", "llm", "drift", "guard", "code-quality", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "tomli >= 1.2.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
memory = [
    "sqlite-fts4",
]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
drifter = "drifter.cli:main"

[project.urls]
Homepage = "https://github.com/hox/drifter"
Documentation = "https://github.com/hox/drifter/tree/main/docs"
Issues = "https://github.com/hox/drifter/issues"
